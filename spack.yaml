# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  config:
    install_tree:
      root: ~/spack_install/install
    source_cache: ~/spack_install/cache
  upstreams:
    spack-instance-1:
      install_tree: /shared/spapps_2026_01
  specs:
    - llvm@22
    - cmake@4.2.3
    - openjdk@25
    - openmpi@5.0.10 +atomics~cuda~debug+fortran+gpfs+internal-hwloc~internal-libevent+internal-pmix~ipv6~java~lustre~memchecker+openshmem~rocm+romio+rsh~static~two_level_namespace+vt+wrapper-rpath build_system=autotools fabrics:=ucc,ucx romio-filesystem:=none schedulers:=slurm %c,cxx=llvm@21
  packages:
    all:
      permissions:
        read: group
        write: group
        group: yo30qaqy
      prefer: ["%c,cxx=llvm@21"]
    llvm:
      buildable: true
    openmpi:
      buildable: true
    curl:
      require: "+libidn2 +nghttp2 tls=openssl"
    ucx:
      require: "+dc +ib_hw_tm +mlx5_dv +openmp +optimizations +pic +thread_multiple +verbs %c,cxx=llvm@21"
      buildable: true
  view: true
  concretizer:
    unify: true
